name: invoice_generator
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  intl: ^0.20.2
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.2
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.2
  shared_preferences: ^2.5.3
  uuid: ^4.6.0
  path_provider: ^2.1.5
  fl_chart: 0.70.2
  supabase_flutter: ^2.8.3
  image_picker: ^1.1.2
  image: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/inv-app-icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/inv-app-icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
